# VELO 生产环境编排文件
#
# 五个服务各司其职：
# - db: PostgreSQL + PostGIS（数据库，存用户/活动/赛段数据）
# - redis: Redis（任务队列，GPX 异步解析用）
# - api: FastAPI 应用（对外提供 API）
# - worker: rq Worker（后台异步解析 GPX + 赛段匹配）
# - caddy: 反向代理（自动 HTTPS，微信小程序硬性要求）
#
# 使用方法：
# 1. 复制 .env.example 为 .env，填入实际密钥
# 2. 修改 Caddyfile 中的域名
# 3. docker-compose up -d
# 4. docker-compose exec api alembic upgrade head（初始化数据库表）
#
# 日志查看：docker-compose logs -f api / worker

services:
  # ===== 数据库：PostgreSQL 16 + PostGIS 3.4 =====
  # PostGIS 提供空间查询能力（赛段匹配的 ST_DWithin 等函数依赖它）
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: velo
      POSTGRES_USER: velo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # 只监听本机，不暴露到公网

  # ===== Redis：任务队列后端 =====
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  # ===== API 服务：FastAPI =====
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://velo:${DB_PASSWORD}@db:5432/velo
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN}
      STRAVA_WEBHOOK_SUBSCRIPTION_ID: ${STRAVA_WEBHOOK_SUBSCRIPTION_ID}
    expose:
      - "8000"  # 只对 Caddy 可见，不暴露到公网
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads

  # ===== Worker：异步任务处理 =====
  # 和 API 用同一个镜像，只是启动命令不同
  worker:
    build: .
    command: python worker.py
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://velo:${DB_PASSWORD}@db:5432/velo
      REDIS_URL: redis://redis:6379/0
      # v5 task-0.8：单 worker 容器订阅多队列
      # velo = GPX/Strava 解析；ai_drafts = AI 草稿生成（task 1.B.1 起用）
      # 用 docker compose up --scale worker=N 横向扩展
      RQ_QUEUES: "velo,ai_drafts"
      # v5 task-1.B.1：worker 跑 AI 草稿生成时调 DeepSeek API
      # task-0.8 commit 04bb17d 漏配（codex 异源审 2026-04-30 抓 Critical）
      # 不配 worker 容器内 _client = None / 所有 AI 草稿静默不生成
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads

  # ===== Cleanup：定时僵尸回收 =====
  # 每 5 分钟运行一次清理脚本，回收孤儿 activity + 孤儿文件
  cleanup:
    build: .
    command: sh -c "while true; do python scripts/cleanup_zombies.py; sleep 300; done"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://velo:${DB_PASSWORD}@db:5432/velo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads

  # ===== Scheduler：Strava 导入调度器 =====
  # 每 30s 触发一次 run_import_tick，推进所有 active 用户的 tier1/tier2 导入
  # 和 worker 分开的理由：worker 是队列消费者，scheduler 是时间驱动
  # 职责不同 → 独立容器便于监控和重启
  # 不挂 uploads 卷：scheduler 路径全程 DB + Redis + HTTP，不写文件系统
  scheduler:
    build: .
    command: python scheduler.py
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://velo:${DB_PASSWORD}@db:5432/velo
      REDIS_URL: redis://redis:6379/0
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
    depends_on:
      - db
      - redis

  # ===== Caddy：反向代理 + 自动 HTTPS =====
  # 微信小程序强制要求 HTTPS，Caddy 自动申请 Let's Encrypt 证书
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP（证书验证 + 自动跳转 HTTPS）
      - "443:443"  # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:      # 数据库持久化
  uploads:     # GPX 文件存储
  caddy_data:  # SSL 证书存储
  caddy_config:
