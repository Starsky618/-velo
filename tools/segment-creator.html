<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛段创建工具 — VELO</title>

<!-- Chart.js：海拔剖面图绘制 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Leaflet：地图渲染 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Google Fonts：DM Sans 正文 + Space Mono 数字 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================================================================
   全局变量 & 重置
   把配色方案集中管理，好比装修房子前先定好色板，
   所有房间（组件）都从这里取色，保证风格统一。
   ================================================================ */
:root {
  /* 暗色背景层级：从最深（底层）到次深（卡片） */
  --bg-deepest: #0d0d1a;
  --bg-base: #131325;
  --bg-card: #1a1a2e;
  --bg-elevated: #222240;
  --bg-hover: #2a2a4a;

  /* 文字色：从最亮到最暗 */
  --text-primary: #e8e6f0;
  --text-secondary: #9896a8;
  --text-muted: #5c5a6e;

  /* 强调色：Strava 标志性的橙红渐变 */
  --accent: #fc4c02;
  --accent-light: #ff6b2b;
  --accent-glow: rgba(252, 76, 2, 0.25);
  --accent-dim: rgba(252, 76, 2, 0.08);

  /* 功能色 */
  --success: #2ecc71;
  --error: #e74c3c;
  --warning: #f39c12;

  /* 赛段选中区域色 */
  --selection-fill: rgba(252, 76, 2, 0.15);
  --selection-border: rgba(252, 76, 2, 0.6);

  /* 轨迹色 */
  --track-gray: #4a4a6a;
  --track-selected: #fc4c02;

  /* 圆角和间距 */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  /* 字体 */
  --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-mono: 'Space Mono', monospace;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  background: var(--bg-deepest);
  color: var(--text-primary);
  min-height: 100vh;
  /* 微妙的纹理背景：模拟轻微噪点，增加深度感 */
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(252, 76, 2, 0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(100, 100, 200, 0.03) 0%, transparent 50%);
}

/* ================================================================
   布局容器
   ================================================================ */
.app-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 32px 60px;
}

/* ================================================================
   顶部栏：Logo + API状态 + JWT输入
   ================================================================ */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0 24px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 28px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -1px;
  box-shadow: 0 2px 12px var(--accent-glow);
}

.logo-text {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text-primary);
}

.logo-text span {
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 8px;
  font-size: 0.85rem;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* API 状态灯 */
.api-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: var(--text-muted);
  padding: 6px 12px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.04);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 0.3s;
}

.status-dot.connected {
  background: var(--success);
  box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
}

.status-dot.disconnected {
  background: var(--error);
  box-shadow: 0 0 6px rgba(231, 76, 60, 0.4);
}

/* JWT 输入 */
.jwt-input-wrap {
  position: relative;
}

.jwt-input {
  width: 260px;
  padding: 7px 12px 7px 32px;
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  outline: none;
  transition: border-color 0.2s;
}

.jwt-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.jwt-input::placeholder {
  color: var(--text-muted);
  font-family: var(--font-body);
}

.jwt-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* ================================================================
   GPX 导入区
   好比机场的"行李托运处"——把你的 GPX 文件交给系统处理。
   没导入文件时显示拖放提示，导入后显示概要信息。
   ================================================================ */
.import-section {
  margin-bottom: 28px;
}

.drop-zone {
  border: 2px dashed rgba(255,255,255,0.08);
  border-radius: var(--radius-lg);
  padding: 48px 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  background: var(--bg-card);
  position: relative;
  overflow: hidden;
}

.drop-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent-dim), transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
}

.drop-zone:hover,
.drop-zone.dragover {
  border-color: var(--accent);
  background: var(--bg-elevated);
}

.drop-zone:hover::before,
.drop-zone.dragover::before {
  opacity: 1;
}

.drop-zone-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
  opacity: 0.6;
  position: relative;
}

.drop-zone-title {
  font-size: 1rem;
  font-weight: 500;
  margin-bottom: 6px;
  position: relative;
}

.drop-zone-sub {
  font-size: 0.82rem;
  color: var(--text-muted);
  position: relative;
}

.drop-zone input[type="file"] {
  display: none;
}

/* 导入后的概要信息条 */
.ride-summary {
  display: none;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px 24px;
  border: 1px solid rgba(255,255,255,0.04);
  animation: slideDown 0.3s ease-out;
}

.ride-summary.visible {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.summary-stats {
  display: flex;
  gap: 32px;
}

.stat-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.stat-value {
  font-family: var(--font-mono);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
}

.stat-value .unit {
  font-size: 0.7rem;
  font-weight: 400;
  color: var(--text-muted);
  margin-left: 2px;
}

.file-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.file-name {
  font-size: 0.82rem;
  color: var(--text-secondary);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.btn-reimport {
  padding: 6px 14px;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}

.btn-reimport:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

/* ================================================================
   主工作区：海拔图 + 地图 纵向排列
   ================================================================ */
.workspace {
  display: none;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 28px;
  animation: fadeIn 0.4s ease-out;
}

.workspace.visible {
  display: flex;
}

/* 海拔图区域 */
.chart-panel {
  background: var(--bg-card);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 20px 24px 14px;
  border: 1px solid rgba(255,255,255,0.04);
  border-bottom: none;
  position: relative;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.chart-title {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.chart-legend {
  display: flex;
  gap: 16px;
  font-size: 0.72rem;
  color: var(--text-muted);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 10px;
  height: 3px;
  border-radius: 2px;
}

.legend-dot.raw { background: rgba(255,255,255,0.15); }
.legend-dot.smooth { background: var(--accent); }

/* Chart.js 画布容器 */
.chart-container {
  position: relative;
  width: 100%;
  height: 220px;
}

.chart-container canvas {
  width: 100% !important;
  height: 100% !important;
}

/* 赛段选择信息条（海拔图下方） */
.selection-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg-elevated);
  border-left: 1px solid rgba(255,255,255,0.04);
  border-right: 1px solid rgba(255,255,255,0.04);
}

.km-inputs {
  display: flex;
  align-items: center;
  gap: 8px;
}

.km-inputs label {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* 起点/终点标签——可点击选中，选中后用键盘 ← → 微调 20m */
.km-label {
  cursor: pointer;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04);
  font-size: 0.78rem !important;
  color: var(--text-secondary) !important;
  transition: all 0.2s;
  user-select: none;
  letter-spacing: 0.5px;
}

.km-label:hover {
  color: var(--text-primary) !important;
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08);
}

.km-label.active {
  color: var(--accent) !important;
  border-color: var(--accent);
  background: rgba(252, 76, 2, 0.15);
  box-shadow: 0 0 8px rgba(252, 76, 2, 0.2);
}

.arrow-hint {
  font-size: 0.65rem;
  color: var(--accent);
  opacity: 0;
  margin-left: 8px;
  transition: opacity 0.3s;
  font-family: var(--font-mono);
}

.arrow-hint.visible {
  opacity: 0.8;
}

.km-input {
  width: 72px;
  padding: 5px 8px;
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}

.km-input:focus {
  border-color: var(--accent);
}

.km-sep {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin: 0 4px;
}

.segment-stats {
  display: flex;
  gap: 24px;
}

.seg-stat {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.seg-stat-value {
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--accent-light);
}

.seg-stat-unit {
  font-size: 0.7rem;
  color: var(--text-muted);
}

/* 地图区域 */
.map-panel {
  background: var(--bg-card);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  border: 1px solid rgba(255,255,255,0.04);
  border-top: none;
  overflow: hidden;
}

#map {
  width: 100%;
  height: 340px;
}

/* Leaflet 暗色调覆盖 */
.leaflet-tile {
  filter: brightness(0.7) contrast(1.1) saturate(0.3);
}

.leaflet-control-zoom a {
  background: var(--bg-card) !important;
  color: var(--text-secondary) !important;
  border-color: rgba(255,255,255,0.08) !important;
}

.leaflet-control-attribution {
  background: rgba(13, 13, 26, 0.8) !important;
  color: var(--text-muted) !important;
  font-size: 0.65rem !important;
}

.leaflet-control-attribution a {
  color: var(--text-muted) !important;
}

/* ================================================================
   创建表单区
   ================================================================ */
.creation-panel {
  display: none;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 28px 28px 24px;
  border: 1px solid rgba(255,255,255,0.04);
  animation: slideUp 0.3s ease-out;
}

.creation-panel.visible {
  display: block;
}

.creation-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.creation-title::before {
  content: '';
  width: 3px;
  height: 18px;
  background: var(--accent);
  border-radius: 2px;
}

.form-row {
  display: flex;
  gap: 16px;
  margin-bottom: 16px;
}

.form-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.3px;
}

.form-group input,
.form-group textarea {
  padding: 10px 14px;
  background: var(--bg-base);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.form-group textarea {
  resize: vertical;
  min-height: 60px;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: var(--text-muted);
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.btn {
  padding: 11px 24px;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  outline: none;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff;
  box-shadow: 0 2px 12px var(--accent-glow);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(252, 76, 2, 0.35);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.08);
}

.btn-secondary:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

/* ================================================================
   消息提示
   ================================================================ */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 14px 20px;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 10000;
  animation: toastIn 0.3s ease-out;
  max-width: 400px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

.toast.success {
  background: rgba(46, 204, 113, 0.15);
  border: 1px solid rgba(46, 204, 113, 0.3);
  color: var(--success);
}

.toast.error {
  background: rgba(231, 76, 60, 0.15);
  border: 1px solid rgba(231, 76, 60, 0.3);
  color: var(--error);
}

.toast.info {
  background: rgba(252, 76, 2, 0.12);
  border: 1px solid rgba(252, 76, 2, 0.25);
  color: var(--accent-light);
}

/* 成功创建后的结果展示卡片 */
.result-card {
  display: none;
  background: var(--bg-base);
  border: 1px solid rgba(46, 204, 113, 0.2);
  border-radius: var(--radius-md);
  padding: 18px 22px;
  margin-top: 20px;
  animation: slideDown 0.3s ease-out;
}

.result-card.visible {
  display: block;
}

.result-card h4 {
  font-size: 0.82rem;
  color: var(--success);
  margin-bottom: 12px;
  font-weight: 600;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.result-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.result-item .r-label {
  font-size: 0.68rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.result-item .r-value {
  font-family: var(--font-mono);
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-primary);
}

/* ================================================================
   动画
   ================================================================ */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* 加载动画 */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ================================================================
   滚动条美化
   ================================================================ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--bg-hover);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}
</style>
</head>
<body>

<div class="app-container">

  <!-- ==================== 顶部栏 ==================== -->
  <header class="top-bar">
    <div class="logo-area">
      <div class="logo-icon">R</div>
      <div class="logo-text">VELO <span>赛段创建工具</span></div>
    </div>
    <div class="top-right">
      <div class="api-status" id="apiStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="apiUrlDisplay">--</span>
      </div>
      <div class="jwt-input-wrap">
        <span class="jwt-icon">🔑</span>
        <input type="password" class="jwt-input" id="jwtInput"
               placeholder="粘贴 JWT Token…"
               autocomplete="off">
      </div>
    </div>
  </header>

  <!-- ==================== GPX 导入区 ==================== -->
  <section class="import-section">
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">📂</div>
      <div class="drop-zone-title">拖放 GPX 文件到此处，或点击选择文件</div>
      <div class="drop-zone-sub">支持标准 GPX 格式，通常包含 2000–8000 个轨迹点</div>
      <input type="file" id="fileInput" accept=".gpx">
    </div>
    <div class="ride-summary" id="rideSummary">
      <div class="summary-stats">
        <div class="stat-item">
          <span class="stat-label">总距离</span>
          <span class="stat-value" id="totalDist">--<span class="unit">km</span></span>
        </div>
        <div class="stat-item">

  <!-- ==================== 工作区：海拔图 + 地图 ==================== -->
  <section class="workspace" id="workspace">
    <!-- 海拔图 -->

<script>
/**
 * ================================================================
 * VELO 赛段创建工具 — 核心逻辑
 *
 * 这个脚本好比一个"赛道测量员"的全套工具箱：
 * 1. GPX 解析器：读懂 GPS 文件，提取每个轨迹点的坐标和海拔
 * 2. 海拔绘图师：用 Chart.js 画出"地形剖面图"
 * 3. 选区拖拽器：在图上拖两个标杆圈定赛段范围
 * 4. 地图联动器：选区变化时，地图上同步高亮对应路段
 * 5. 提交打包员：把选好的赛段数据打包发给后端 API
 *
 * 注意事项：
 * - 所有坐标都是 WGS-84，不做任何坐标转换
 * - 距离计算用 haversine 公式（球面距离）
 * - 海拔图的"双渲染"：灰色填充是原始数据，橙色线是滑动平均平滑后的
 * - 拖拽交互直接在 Chart.js 的 canvas 上监听鼠标事件
 * ================================================================
 */

// ==================== 配置 ====================
// API 基地址——部署时改成实际服务器地址
const API_BASE_URL = 'http://localhost:8000';

// ==================== 全局状态 ====================
// 好比一个全局"黑板"，所有模块都来这里读写共享数据
let state = {
  // GPX 解析后的轨迹点数组 [{lat, lon, ele, time, cumDist}, ...]
  trackpoints: [],
  // 轨迹总距离（公里）
  totalDistKm: 0,
  // 选区的起止公里数
  startKm: 0,
  endKm: 0,
  // Chart.js 实例
  chart: null,
  // Leaflet 地图实例和图层
  map: null,
  fullTrackLayer: null,    // 完整轨迹（灰色）
  selectedLayer: null,     // 选中段（橙色）
  startMarker: null,       // 起点标记
  endMarker: null,         // 终点标记
  // 拖拽状态
  dragging: null,          // 'start' | 'end' | null
  // 文件名
  fileName: '',
};

// ==================== 工具函数 ====================

/**
 * haversine 公式——计算地球表面两点之间的距离（米）。
 * 地球不是平的，两点之间的"直线距离"其实是球面上的弧线。
 * 好比在篮球表面从 A 点到 B 点，沿球面走的弧线长度。
 */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000; // 地球半径（米）
  const toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad;
  const dLon = (lon2 - lon1) * toRad;
  const a = Math.sin(dLat / 2) ** 2
          + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad)
          * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/**
 * Douglas-Peucker 轨迹简化算法——把密密麻麻的轨迹点精简到合理数量。
 *
 * 好比画一条弯弯曲曲的线：
 * 1. 先连首尾两端（一根橡皮筋拉直）
 * 2. 找离这根"橡皮筋"最远的点——如果它足够远，说明这里有个重要拐弯
 * 3. 以这个点为分界，左右两边各自递归执行同样的操作
 * 4. 太近的点就丢掉——视觉上看不出区别
 *
 * 这里用的是"经纬度近似平面距离"版本，适合地图显示（不需要高精度）。
 */
function douglasPeucker(points, epsilon) {
  if (points.length <= 2) return points;

  // 找离首尾连线最远的点
  let maxDist = 0;
  let maxIdx = 0;
  const start = points[0];
  const end = points[points.length - 1];

  for (let i = 1; i < points.length - 1; i++) {
    const d = perpendicularDist(points[i], start, end);
    if (d > maxDist) {
      maxDist = d;
      maxIdx = i;
    }
  }

  // 如果最远的点也不够远，中间所有点都可以丢弃
  if (maxDist <= epsilon) {
    return [start, end];
  }

  // 递归处理左半段和右半段
  const left = douglasPeucker(points.slice(0, maxIdx + 1), epsilon);
  const right = douglasPeucker(points.slice(maxIdx), epsilon);

  // 拼接（去掉右半段的第一个点，因为和左半段最后一个重复）
  return left.concat(right.slice(1));
}

/**
 * 计算一个点到一条线段的垂直距离（经纬度近似）。
 * 用于 Douglas-Peucker 算法判断"这个点重不重要"。
 */
function perpendicularDist(point, lineStart, lineEnd) {
  const dx = lineEnd.lon - lineStart.lon;
  const dy = lineEnd.lat - lineStart.lat;
  const lenSq = dx * dx + dy * dy;

  if (lenSq === 0) {
    // 首尾重合，直接算点到点距离
    return Math.sqrt((point.lon - lineStart.lon) ** 2 + (point.lat - lineStart.lat) ** 2);
  }

  // 投影参数 t（点在线段上的投影位置）
  let t = ((point.lon - lineStart.lon) * dx + (point.lat - lineStart.lat) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));

  const projLon = lineStart.lon + t * dx;
  const projLat = lineStart.lat + t * dy;

  // 转成近似米（1度纬度约 111km，1度经度约 111km * cos(lat)）
  const latDiff = (point.lat - projLat) * 111320;
  const lonDiff = (point.lon - projLon) * 111320 * Math.cos(point.lat * Math.PI / 180);
  return Math.sqrt(latDiff ** 2 + lonDiff ** 2);
}

/**
 * 滑动平均平滑——给锯齿状的海拔数据"磨平毛刺"。
 * 窗口大小 = 总点数的 2%，限制在 [5, 30] 之间。
 * 好比用一个"窗口"从左扫到右，窗口内的值取平均——
 * 局部的突刺被周围的正常值拉回来了。
 */
function smoothElevation(elevations) {
  const n = elevations.length;
  if (n < 5) return [...elevations];

  // 窗口半径：总点数的 1%（半窗口），全窗口 = 2%，限制 [5, 30]
  let window = Math.round(n * 0.02);
  window = Math.max(5, Math.min(30, window));
  const half = Math.floor(window / 2);

  const result = new Array(n);
  // 用"前缀和"技巧加速滑动平均计算
  // 好比记账时先把每天的累计总额算好，要查某段时间的平均值直接做减法
  const prefix = new Array(n + 1);
  prefix[0] = 0;
  for (let i = 0; i < n; i++) {
    prefix[i + 1] = prefix[i] + elevations[i];
  }

  for (let i = 0; i < n; i++) {
    const lo = Math.max(0, i - half);
    const hi = Math.min(n - 1, i + half);
    const count = hi - lo + 1;
    result[i] = (prefix[hi + 1] - prefix[lo]) / count;
  }

  return result;
}

/**
 * 格式化秒数为"X时Y分Z秒"的可读格式
 */
function formatDuration(seconds) {
  if (!seconds || seconds <= 0) return '--';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}时${m}分`;
  if (m > 0) return `${m}分${s}秒`;
  return `${s}秒`;
}

// ==================== GPX 解析 ====================
/**
 * 解析 GPX 文件文本，提取轨迹点。
 *
 * GPX 是 GPS 设备导出的标准 XML 格式，结构大致是：
 * <gpx> → <trk> → <trkseg> → <trkpt lat="..." lon="..."> → <ele>海拔</ele><time>时间</time>
 *
 * 解析步骤：
 * 1. 跳过 BOM（某些编辑器会在文件开头加一个不可见字符）
 * 2. 用 DOMParser 把 XML 文本变成可查询的 DOM 树
 * 3. 遍历所有 <trkpt> 节点，提取经纬度、海拔、时间
 * 4. 用 haversine 逐点累加计算每个点的累计距离
 */
function parseGPX(text) {
  // 跳过 BOM（Byte Order Mark）——有些 Windows 编辑器会在 UTF-8 文件头加 \uFEFF
  if (text.charCodeAt(0) === 0xFEFF) {
    text = text.substring(1);
  }

  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'application/xml');

  // 检查 XML 解析错误
  const parseError = doc.querySelector('parsererror');
  if (parseError) {
    throw new Error('GPX 文件格式错误，无法解析 XML');
  }

  const trkpts = doc.querySelectorAll('trkpt');
  if (trkpts.length === 0) {
    throw new Error('GPX 文件中没有找到轨迹点（<trkpt>）');
  }

  const points = [];
  let cumDist = 0; // 累计距离（米）

  trkpts.forEach((pt, i) => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));

    // 海拔和时间是可选字段
    const eleNode = pt.querySelector('ele');
    const timeNode = pt.querySelector('time');
    const ele = eleNode ? parseFloat(eleNode.textContent) : null;
    const time = timeNode ? new Date(timeNode.textContent) : null;

    // 从第二个点开始，累加与前一个点的距离
    if (i > 0) {
      const prev = points[i - 1];
      cumDist += haversine(prev.lat, prev.lon, lat, lon);
    }

    points.push({ lat, lon, ele, time, cumDist });
  });

  return points;
}

// ==================== 海拔图绘制 ====================

/**
 * 用 Chart.js 绘制海拔剖面图。
 *
 * "双渲染"设计：
 * - 底层灰色填充：原始海拔数据的真实面貌（有锯齿很正常，GPS 海拔本来就不精确）
 * - 顶层橙色曲线：平滑后的趋势线，让人看清地形走势
 *
 * 选区实现：
 * - Chart.js 插件机制（plugin）在绑定区域内画半透明矩形和两条竖线
 * - 鼠标事件监听实现拖拽
 */
function buildChart() {
  const points = state.trackpoints;
  // X 轴：累计公里数
  const xData = points.map(p => p.cumDist / 1000);
  // Y 轴：原始海拔
  const rawEle = points.map(p => p.ele ?? 0);
  // Y 轴：平滑海拔
  const smoothEle = smoothElevation(rawEle);

  const ctx = document.getElementById('elevationChart').getContext('2d');

  // 如果已有图表实例，先销毁
  if (state.chart) {
    state.chart.destroy();
  }

  // 选区绘制插件——在 Chart.js 渲染完成后，叠加画选区矩形和竖线
  const selectionPlugin = {
    id: 'selectionOverlay',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;

      const xScale = scales.x;
      // 把公里数转成画布像素坐标
      const xStart = xScale.getPixelForValue(state.startKm);
      const xEnd = xScale.getPixelForValue(state.endKm);

      // 画选中区域的半透明填充
      ctx.save();
      ctx.fillStyle = 'rgba(252, 76, 2, 0.12)';
      ctx.fillRect(xStart, chartArea.top, xEnd - xStart, chartArea.bottom - chartArea.top);

      // 画两条竖虚线（起点和终点标记）
      [xStart, xEnd].forEach((x, i) => {
        ctx.beginPath();
        ctx.setLineDash([4, 3]);
        ctx.strokeStyle = 'rgba(252, 76, 2, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);

        // 底部圆形拖拽手柄
        ctx.beginPath();
        ctx.arc(x, chartArea.bottom + 2, 7, 0, Math.PI * 2);
        ctx.fillStyle = i === 0 ? '#fc4c02' : '#ff6b2b';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      ctx.restore();
    }
  };

  state.chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: xData,
      datasets: [
        {
          // 底层：原始数据灰色填充
          label: '原始海拔',
          data: rawEle,
          borderColor: 'rgba(255,255,255,0.08)',
          borderWidth: 1,
          backgroundColor: 'rgba(255,255,255,0.04)',
          fill: true,
          pointRadius: 0,
          tension: 0,
          order: 2,
        },
        {
          // 顶层：平滑曲线
          label: '平滑海拔',
          data: smoothEle,
          borderColor: '#fc4c02',
          borderWidth: 2,
          backgroundColor: 'rgba(252, 76, 2, 0.08)',
          fill: true,
          pointRadius: 0,
          tension: 0.2,
          order: 1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 600 },
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(26, 26, 46, 0.95)',
          titleColor: '#9896a8',
          bodyColor: '#e8e6f0',
          borderColor: 'rgba(255,255,255,0.08)',
          borderWidth: 1,
          padding: 10,
          titleFont: { family: 'DM Sans, Noto Sans SC, sans-serif', size: 11 },
          bodyFont: { family: 'Space Mono, monospace', size: 12 },
          callbacks: {
            title: (items) => `${parseFloat(items[0].label).toFixed(2)} km`,
            label: (item) => {
              if (item.datasetIndex === 1) {
                return `海拔: ${item.raw.toFixed(1)} m`;
              }
              return null;
            },
          },
        },
      },
      scales: {
        x: {
          type: 'linear',
          title: {
            display: true,
            text: '距离 (km)',
            color: '#5c5a6e',
            font: { family: 'DM Sans, Noto Sans SC, sans-serif', size: 11 },
          },
          grid: { color: 'rgba(255,255,255,0.03)' },
          ticks: {
            color: '#5c5a6e',
            font: { family: 'Space Mono, monospace', size: 10 },
            callback: v => v.toFixed(1),
            maxTicksLimit: 12,
          },
        },
        y: {
          title: {
            display: true,
            text: '海拔 (m)',
            color: '#5c5a6e',
            font: { family: 'DM Sans, Noto Sans SC, sans-serif', size: 11 },
          },
          grid: { color: 'rgba(255,255,255,0.03)' },
          ticks: {
            color: '#5c5a6e',
            font: { family: 'Space Mono, monospace', size: 10 },
            maxTicksLimit: 6,
          },
        },
      },
    },
    plugins: [selectionPlugin],
  });

  // 设置初始选区：默认选中中间 30% 的区域
  const total = state.totalDistKm;
  state.startKm = parseFloat((total * 0.35).toFixed(2));
  state.endKm = parseFloat((total * 0.65).toFixed(2));
  updateSelectionUI();

  // 绑定 canvas 鼠标事件实现拖拽
  setupChartDrag();
}

// ==================== 拖拽交互 ====================

/**
 * 在 Chart.js 的 canvas 上监听鼠标事件，实现"拖拽竖线选择赛段"的交互。
 *
 * 原理好比在尺子上移动两个夹子：
 * 1. mousedown：判断鼠标离哪个夹子更近（起点/终点），如果足够近就"抓住"它
 * 2. mousemove：被抓住的夹子跟着鼠标走，实时更新选区
 * 3. mouseup：松手，释放夹子
 */
function setupChartDrag() {
  const canvas = document.getElementById('elevationChart');

  canvas.addEventListener('mousedown', (e) => {
    const chart = state.chart;
    if (!chart) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;

    const xScale = chart.scales.x;
    const startPx = xScale.getPixelForValue(state.startKm);
    const endPx = xScale.getPixelForValue(state.endKm);

    // 判断鼠标离哪个手柄更近（容差 15px）
    const distStart = Math.abs(mouseX - startPx);
    const distEnd = Math.abs(mouseX - endPx);

    if (distStart < 15 && distStart <= distEnd) {
      state.dragging = 'start';
      canvas.style.cursor = 'col-resize';
    } else if (distEnd < 15) {
      state.dragging = 'end';
      canvas.style.cursor = 'col-resize';
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    const chart = state.chart;
    if (!chart) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const xScale = chart.scales.x;

    if (state.dragging) {
      // 鼠标像素位置 → 公里数
      let km = xScale.getValueForPixel(mouseX);
      km = Math.max(0, Math.min(state.totalDistKm, km));
      km = parseFloat(km.toFixed(2));

      // 最小距离约束：起终点至少相距 0.5 km
      if (state.dragging === 'start') {
        state.startKm = Math.min(km, state.endKm - 0.5);
        state.startKm = Math.max(0, state.startKm);
      } else {
        state.endKm = Math.max(km, state.startKm + 0.5);
        state.endKm = Math.min(state.totalDistKm, state.endKm);
      }

      updateSelectionUI();
      chart.update('none'); // 无动画更新
    } else {
      // 没有拖拽时，鼠标悬停在手柄附近显示 resize 光标
      const startPx = xScale.getPixelForValue(state.startKm);
      const endPx = xScale.getPixelForValue(state.endKm);
      if (Math.abs(mouseX - startPx) < 12 || Math.abs(mouseX - endPx) < 12) {
        canvas.style.cursor = 'col-resize';
      } else {
        canvas.style.cursor = 'default';
      }
    }
  });

  canvas.addEventListener('mouseup', () => {
    state.dragging = null;
    canvas.style.cursor = 'default';
  });

  canvas.addEventListener('mouseleave', () => {
    state.dragging = null;
    canvas.style.cursor = 'default';
  });
}

// ==================== 选区状态更新 ====================

/**
 * 核心联动函数——选区（起止公里数）变化后，刷新所有关联组件。
 *
 * 这是"牵一发动全身"的枢纽：
 * 1. 更新输入框的公里数显示
 * 2. 计算并显示选中段的统计数据（距离、爬升、下降、坡度）
 * 3. 更新地图上的高亮路段和标记点
 */
function updateSelectionUI() {
  // 1. 同步输入框
  document.getElementById('startKmInput').value = state.startKm.toFixed(2);
  document.getElementById('endKmInput').value = state.endKm.toFixed(2);

  // 2. 计算赛段统计数据
  const segPoints = getPointsInRange(state.startKm, state.endKm);
  const stats = calcSegmentStats(segPoints);

  document.getElementById('segDist').textContent = stats.distance.toFixed(2);
  document.getElementById('segGain').textContent = Math.round(stats.gain);
  document.getElementById('segLoss').textContent = Math.round(stats.loss);
  document.getElementById('segGrad').textContent = stats.gradient.toFixed(1);

  // 3. 更新地图
  updateMapSelection(segPoints);
}

/**
 * 获取某个公里范围内的轨迹点子集。
 * 用于在选区变化时，快速截取对应的轨迹点。
 */
function getPointsInRange(startKm, endKm) {
  const startM = startKm * 1000;
  const endM = endKm * 1000;
  return state.trackpoints.filter(p => p.cumDist >= startM && p.cumDist <= endM);
}

/**
 * 计算一段轨迹的统计数据：距离、累计爬升、累计下降、平均坡度。
 */
function calcSegmentStats(points) {
  if (points.length < 2) {
    return { distance: 0, gain: 0, loss: 0, gradient: 0 };
  }

  const dist = (points[points.length - 1].cumDist - points[0].cumDist) / 1000; // 米→公里
  let gain = 0;
  let loss = 0;

  for (let i = 1; i < points.length; i++) {
    const e1 = points[i - 1].ele ?? 0;
    const e2 = points[i].ele ?? 0;
    const diff = e2 - e1;
    if (diff > 0) gain += diff;
    else loss += Math.abs(diff);
  }

  // 平均坡度 = (终点海拔 - 起点海拔) / 水平距离 * 100%
  // 注意这里用首尾海拔差，不是累计爬升
  const startEle = points[0].ele ?? 0;
  const endEle = points[points.length - 1].ele ?? 0;
  const horizDist = dist * 1000; // 转回米
  const gradient = horizDist > 0 ? ((endEle - startEle) / horizDist) * 100 : 0;

  return { distance: dist, gain, loss, gradient };
}

// ==================== 地图 ====================

/**
 * 初始化 Leaflet 地图，绘制完整轨迹。
 *
 * 绘制策略：
 * - 完整轨迹先做 Douglas-Peucker 简化到 ~800 点（减少渲染压力）
 * - 灰色粗线画全程，橙色亮线画选中段
 * - fitBounds 自动缩放到合适级别
 */
function initMap() {
  if (state.map) {
    state.map.remove();
  }

  state.map = L.map('map', {
    zoomControl: true,
    attributionControl: true,
  });

  // OpenStreetMap 暗色风格瓦片
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19,
  }).addTo(state.map);

  // 简化轨迹点用于地图显示
  const simplified = simplifyForMap(state.trackpoints);

  // 画完整轨迹（灰色底线）
  const fullCoords = simplified.map(p => [p.lat, p.lon]);
  state.fullTrackLayer = L.polyline(fullCoords, {
    color: '#4a4a6a',
    weight: 3,
    opacity: 0.8,
  }).addTo(state.map);

  // 初始化选中段图层（橙色，稍后由 updateMapSelection 填充）
  state.selectedLayer = L.polyline([], {
    color: '#fc4c02',
    weight: 4,
    opacity: 1,
  }).addTo(state.map);

  // 起终点标记
  const markerOpts = (color) => ({
    radius: 7,
    fillColor: color,
    fillOpacity: 1,
    color: '#fff',
    weight: 2,
  });

  state.startMarker = L.circleMarker([0, 0], markerOpts('#fc4c02')).addTo(state.map);
  state.endMarker = L.circleMarker([0, 0], markerOpts('#ff6b2b')).addTo(state.map);

  // 自动缩放到轨迹范围
  state.map.fitBounds(state.fullTrackLayer.getBounds(), { padding: [30, 30] });
}

/**
 * Douglas-Peucker 简化到约 800 个点，用于地图显示。
 * 通过二分法搜索合适的 epsilon 值来控制输出点数。
 */
function simplifyForMap(points) {
  const targetCount = 800;
  if (points.length <= targetCount) return points;

  // 二分搜索 epsilon：找到让输出点数最接近目标的容差
  let lo = 0.000001; // 经纬度单位的 epsilon
  let hi = 0.01;
  let result = points;

  for (let iter = 0; iter < 20; iter++) {
    const mid = (lo + hi) / 2;
    result = douglasPeucker(points, mid);
    if (result.length > targetCount) {
      lo = mid;
    } else {
      hi = mid;
    }
    // 接近目标就停止
    if (Math.abs(result.length - targetCount) < targetCount * 0.1) break;
  }

  return result;
}

/**
 * 更新地图上的选中路段高亮和标记点。
 * 每次选区变化都会调用，需要足够快（避免卡顿）。
 */
function updateMapSelection(segPoints) {
  if (!state.map || segPoints.length < 2) return;

  const coords = segPoints.map(p => [p.lat, p.lon]);
  state.selectedLayer.setLatLngs(coords);

  const first = segPoints[0];
  const last = segPoints[segPoints.length - 1];
  state.startMarker.setLatLng([first.lat, first.lon]);
  state.endMarker.setLatLng([last.lat, last.lon]);
}

// ==================== API 交互 ====================

/**
 * 检测 API 连接状态——发一个轻量级请求探测服务器是否在线。
 * 好比去饭店先看看门有没有开着。
 */
async function checkApiStatus() {
  const dot = document.getElementById('statusDot');
  const display = document.getElementById('apiUrlDisplay');
  display.textContent = API_BASE_URL;

  try {
    // 用 HEAD 请求或 GET 一个轻量级接口探测
    const resp = await fetch(`${API_BASE_URL}/api/segments?page=1&page_size=1`, {
      method: 'GET',
      signal: AbortSignal.timeout(3000),
    });
    if (resp.ok || resp.status === 404) {
      // 404 也算"连通"——服务器在线，只是没数据
      dot.className = 'status-dot connected';
    } else {
      dot.className = 'status-dot disconnected';
    }
  } catch {
    dot.className = 'status-dot disconnected';
  }
}

/**
 * 构建要提交给 API 的赛段数据载荷。
 * 从选中的轨迹点中提取 reference_points 数组。
 */
function buildPayload() {
  const name = document.getElementById('segmentName').value.trim();
  const description = document.getElementById('segmentDesc').value.trim() || undefined;

  if (!name) {
    throw new Error('请输入赛段名称');
  }

  const segPoints = getPointsInRange(state.startKm, state.endKm);
  if (segPoints.length < 2) {
    throw new Error('选中的轨迹点太少，请调整选区范围');
  }

  // 对选中段做适度简化——API 不需要几千个点，几百个足够精确描述路线
  let refPoints = segPoints;
  if (refPoints.length > 500) {
    // 目标约 300 个点
    let lo = 0.000001;
    let hi = 0.005;
    for (let iter = 0; iter < 15; iter++) {
      const mid = (lo + hi) / 2;
      const simplified = douglasPeucker(refPoints, mid);
      if (simplified.length > 300) lo = mid;
      else hi = mid;
      if (Math.abs(simplified.length - 300) < 50) {
        refPoints = simplified;
        break;
      }
      refPoints = simplified;
    }
  }

  const reference_points = refPoints.map(p => ({
    lat: parseFloat(p.lat.toFixed(6)),
    lon: parseFloat(p.lon.toFixed(6)),
    ele: p.ele != null ? parseFloat(p.ele.toFixed(1)) : undefined,
  }));

  // 过滤掉 ele 为 undefined 的字段（JSON.stringify 会自动忽略 undefined）
  const cleanPoints = reference_points.map(p => {
    const obj = { lat: p.lat, lon: p.lon };
    if (p.ele !== undefined) obj.ele = p.ele;
    return obj;
  });

  return {
    name,
    description,
    reference_points: cleanPoints,
    coordinate_system: 'wgs84',
  };
}

/**
 * 提交赛段到 API——POST /api/segments
 */
async function createSegment() {
  const jwt = document.getElementById('jwtInput').value.trim();
  if (!jwt) {
    showToast('请先在右上角输入 JWT Token', 'error');
    return;
  }

  let payload;
  try {
    payload = buildPayload();
  } catch (e) {
    showToast(e.message, 'error');
    return;
  }

  const btn = document.getElementById('btnCreate');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> 提交中…';
  btn.disabled = true;

  try {
    const resp = await fetch(`${API_BASE_URL}/api/segments`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${jwt}`,
      },
      body: JSON.stringify(payload),
    });

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.detail || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    showToast('赛段创建成功!', 'success');
    showResult(data);
  } catch (e) {
    showToast(`创建失败: ${e.message}`, 'error');
  } finally {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
}

/**
 * 显示创建成功后的结果卡片
 */
function showResult(data) {
  const grid = document.getElementById('resultGrid');
  const card = document.getElementById('resultCard');

  const items = [
    { label: '赛段ID', value: data.id },
    { label: '名称', value: data.name },
    { label: '距离', value: `${data.distance} km` },
    { label: '爬升', value: `${data.elevation_gain ?? '--'} m` },
    { label: '下降', value: `${data.elevation_loss ?? '--'} m` },
    { label: '坡度', value: `${data.avg_gradient ?? '--'} %` },
    { label: '容差', value: `${data.match_tolerance} m` },
    { label: '匹配率', value: `${(data.min_match_ratio * 100).toFixed(0)} %` },
  ];

  grid.innerHTML = items.map(i => `
    <div class="result-item">
      <span class="r-label">${i.label}</span>
      <span class="r-value">${i.value}</span>
    </div>
  `).join('');

  card.classList.add('visible');
}

/**
 * 下载 JSON 文件——把赛段数据以文件形式保存到本地。
 * 用 Blob + URL.createObjectURL 技巧触发浏览器下载。
 */
function downloadJSON() {
  let payload;
  try {
    payload = buildPayload();
  } catch (e) {
    showToast(e.message, 'error');
    return;
  }

  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  // 文件名：把赛段名中的特殊字符替换掉
  const safeName = payload.name.replace(/[^a-zA-Z0-9\u4e00-\u9fff_-]/g, '_');
  a.href = url;
  a.download = `segment-${safeName}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast('JSON 文件已下载', 'info');
}

// ==================== UI 辅助 ====================

/**
 * 显示浮动提示消息
 */
function showToast(message, type = 'info') {
  // 移除已有的 toast
  document.querySelectorAll('.toast').forEach(t => t.remove());

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);

  // 3 秒后自动消失
  setTimeout(() => {
    toast.style.transition = 'opacity 0.3s';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ==================== 主流程：文件导入 ====================

/**
 * 处理 GPX 文件——从读取文件到渲染所有组件的完整流程。
 */
function handleFile(file) {
  if (!file || !file.name.toLowerCase().endsWith('.gpx')) {
    showToast('请选择 .gpx 格式的文件', 'error');
    return;
  }

  state.fileName = file.name;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const points = parseGPX(e.target.result);
      state.trackpoints = points;
      state.totalDistKm = parseFloat((points[points.length - 1].cumDist / 1000).toFixed(2));

      // 显示概要信息
      displaySummary(points);

      // 隐藏拖放区，显示工作区
      document.getElementById('dropZone').style.display = 'none';
      document.getElementById('rideSummary').classList.add('visible');
      document.getElementById('workspace').classList.add('visible');
      document.getElementById('creationPanel').classList.add('visible');

      // 绘制海拔图和地图
      buildChart();
      // 地图需要稍等一下让 DOM 元素获得正确尺寸
      setTimeout(() => initMap(), 100);

      showToast(`成功导入 ${points.length} 个轨迹点`, 'success');
    } catch (err) {
      showToast(`解析失败: ${err.message}`, 'error');
    }
  };
  reader.readAsText(file);
}

/**
 * 显示骑行概要统计
 */
function displaySummary(points) {
  const totalDist = points[points.length - 1].cumDist / 1000;
  document.getElementById('totalDist').innerHTML = `${totalDist.toFixed(2)}<span class="unit">km</span>`;

  // 累计爬升
  let gain = 0;
  for (let i = 1; i < points.length; i++) {
    const diff = (points[i].ele ?? 0) - (points[i - 1].ele ?? 0);
    if (diff > 0) gain += diff;
  }
  document.getElementById('totalGain').innerHTML = `${Math.round(gain)}<span class="unit">m</span>`;

  // 骑行时间
  const first = points[0].time;
  const last = points[points.length - 1].time;
  if (first && last) {
    const seconds = (last - first) / 1000;
    document.getElementById('totalTime').textContent = formatDuration(seconds);
  } else {
    document.getElementById('totalTime').textContent = '--';
  }

  // 轨迹点数
  document.getElementById('totalPoints').textContent = points.length.toLocaleString();

  // 文件名
  document.getElementById('fileName').textContent = state.fileName;
}

// ==================== 事件绑定 ====================

document.addEventListener('DOMContentLoaded', () => {
  // API 状态检测
  checkApiStatus();
  // 每 30 秒重新检测一次
  setInterval(checkApiStatus, 30000);

  // 文件选择
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');

  dropZone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      handleFile(e.target.files[0]);
    }
  });

  // 拖放支持
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  // 重新选择文件
  document.getElementById('btnReimport').addEventListener('click', () => {
    // 重置状态
    document.getElementById('dropZone').style.display = '';
    document.getElementById('rideSummary').classList.remove('visible');
    document.getElementById('workspace').classList.remove('visible');
    document.getElementById('creationPanel').classList.remove('visible');
    document.getElementById('resultCard').classList.remove('visible');
    fileInput.value = '';
    fileInput.click();
  });

  // ==================== 键盘左右箭头微调 ====================
  // 点击"起点"或"终点"标签选中它，然后用键盘 ← → 每次微调 20 米（0.02 km）。
  // 长按自动连续调整：首次延迟 300ms，之后每 80ms 触发一次。
  // 好比收音机旋钮的数字微调——粗调靠拖滑块，精调靠方向键。

  let activeEndpoint = null;    // 当前选中的端点：'start' 或 'end'
  let arrowInterval = null;     // 长按定时器
  let arrowTimeout = null;      // 长按首次延迟

  // 点击标签或输入框 → 选中对应端点
  document.querySelectorAll('[data-target]').forEach(el => {
    el.addEventListener('click', () => {
      setActiveEndpoint(el.dataset.target);
    });
    el.addEventListener('focus', () => {
      setActiveEndpoint(el.dataset.target);
    });
  });

  function setActiveEndpoint(target) {
    activeEndpoint = target;
    // 更新标签高亮
    document.getElementById('labelStart').classList.toggle('active', target === 'start');
    document.getElementById('labelEnd').classList.toggle('active', target === 'end');
    // 显示微调提示
    document.getElementById('arrowHint').classList.add('visible');
  }

  // 微调核心：移动指定端点 ±0.02 km
  function nudgeEndpoint(direction) {
    if (!activeEndpoint || !state.chart) return;
    const step = 0.02; // 20 米
    const delta = direction === 'right' ? step : -step;

    if (activeEndpoint === 'start') {
      let newVal = state.startKm + delta;
      newVal = Math.max(0, Math.min(newVal, state.endKm - 0.5));
      state.startKm = parseFloat(newVal.toFixed(2));
    } else {
      let newVal = state.endKm + delta;
      newVal = Math.max(state.startKm + 0.5, Math.min(newVal, state.totalDistKm));
      state.endKm = parseFloat(newVal.toFixed(2));
    }

    updateSelectionUI();
    state.chart.update('none');
  }

  // keydown：首次触发 + 长按连续调整
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    // 如果焦点在输入框（正在手动输入公里数），不拦截方向键
    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
    if (!activeEndpoint) return;

    e.preventDefault();
    const dir = e.key === 'ArrowRight' ? 'right' : 'left';

    // 防止 keydown 重复触发时重复启动定时器
    if (arrowInterval || arrowTimeout) return;

    // 立即执行一次
    nudgeEndpoint(dir);

    // 300ms 后开始连续调整（每 80ms 一次）
    arrowTimeout = setTimeout(() => {
      arrowInterval = setInterval(() => nudgeEndpoint(dir), 80);
    }, 300);
  });

  // keyup：停止连续调整
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      clearTimeout(arrowTimeout);
      clearInterval(arrowInterval);
      arrowTimeout = null;
      arrowInterval = null;
    }
  });

  // 点击页面空白处取消选中
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.km-inputs') && !e.target.closest('.chart-container')) {
      activeEndpoint = null;
      document.getElementById('labelStart').classList.remove('active');
      document.getElementById('labelEnd').classList.remove('active');
      document.getElementById('arrowHint').classList.remove('visible');
    }
  });

  // 公里数输入框：手动输入 → 更新选区
  ['startKmInput', 'endKmInput'].forEach(id => {
    document.getElementById(id).addEventListener('change', (e) => {
      let val = parseFloat(e.target.value);
      if (isNaN(val)) return;
      val = Math.max(0, Math.min(state.totalDistKm, val));
      val = parseFloat(val.toFixed(2));

      if (id === 'startKmInput') {
        // 起点不能超过终点 - 0.5
        state.startKm = Math.min(val, state.endKm - 0.5);
        state.startKm = Math.max(0, state.startKm);
      } else {
        // 终点不能小于起点 + 0.5
        state.endKm = Math.max(val, state.startKm + 0.5);
        state.endKm = Math.min(state.totalDistKm, state.endKm);
      }

      updateSelectionUI();
      if (state.chart) state.chart.update('none');
    });
  });

  // 创建赛段按钮
  document.getElementById('btnCreate').addEventListener('click', createSegment);

  // 下载 JSON 按钮
  document.getElementById('btnDownload').addEventListener('click', downloadJSON);
});
</script>
