# Alembic 数据库迁移配置
#
# 这是数据库表结构的"版本管理器"——就像 Git 管代码版本一样，
# Alembic 管数据库表的版本。每次改表结构（加字段、改类型、建索引），
# 都生成一个迁移脚本，记录"从什么变成什么"，可以前进也可以回退。
#
# 使用方法（需要连接 PostgreSQL）：
#   python3 -m alembic revision --autogenerate -m "描述"  ← 生成迁移脚本
#   python3 -m alembic upgrade head                       ← 执行迁移到最新版本
#   python3 -m alembic downgrade -1                       ← 回退一个版本
#
# 注意：sqlalchemy.url 这里留空，实际值从 app/config.py 的 DATABASE_URL 读取，
# 见 migrations/env.py 中的覆盖逻辑。

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# 数据库地址占位符——实际运行时被 env.py 用 app/config.py 的值覆盖，
# 所以这里写什么都不影响，但不能删（Alembic 要求此项存在）
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
