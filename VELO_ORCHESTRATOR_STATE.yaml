current_phase:
  id: A
  name: architecture_contracts_eval_first
  status: in_progress
  goal: Convert the Agent-First architecture from a design hypothesis into explicit
    ADRs, typed contracts, VeloBench v0, and a deterministic fake environment.
  exit_criteria:
  - at_least_30_repeatable_cases
  - every_case_has_expected_end_state
  - every_case_has_forbidden_actions
  - every_case_has_code_grader
  - no_real_tencent_network_call
  - no_production_database_required
  - provider_success_timeout_ambiguity_no_result_disconnect_and_hard_fail_are_simulatable
  - raw_provider_orm_public_publish_and_real_export_are_unreachable
  - at_least_10_versioned_gold_world_packages
  - gold_world_packages_cover_at_least_6_route_shapes
  - every_exposed_world_fact_has_scope
  - every_exposed_world_fact_has_provenance_or_calculation
  - every_exposed_world_fact_has_freshness
  - missing_information_is_explicit_unknown
  - context_manifest_records_omissions_and_token_budget
  - at_least_30_velobench_cases_consume_versioned_world_packages
  - unverified_rider_reports_never_silently_become_canonical_facts
